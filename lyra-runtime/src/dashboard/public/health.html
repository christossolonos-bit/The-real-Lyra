<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lyra Health</title>
<style>
  :root { --bg:#f6f6f8; --panel:#fff; --text:#18181b; --muted:#6b6b76; --border:#e3e3e8; --accent:#0e9fbf; --good:#1f9d55; --warn:#c27c0e; --bad:#c43c3c; --idle:#8a8a94; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0b1116; --panel:#111b22; --text:#e6f4f8; --muted:#8aa3ad; --border:#21323c; --accent:#3fe0ff; --good:#3ddc84; --warn:#f0b445; --bad:#ff6b6b; --idle:#6f8590; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,sans-serif; }
  header { display:flex; gap:12px; align-items:center; padding:14px 20px; border-bottom:1px solid var(--border); background:var(--panel); flex-wrap:wrap; }
  header a { color:var(--muted); text-decoration:none; }
  header h1 { margin:0; font-size:18px; }
  #overall { margin-left:auto; font-weight:600; display:flex; gap:8px; align-items:center; }
  .dot { width:10px; height:10px; border-radius:50%; flex:none; display:inline-block; }
  .ok { color:var(--good); } .warn { color:var(--warn); } .bad { color:var(--bad); } .idle { color:var(--idle); }
  .dot.ok { background:var(--good); } .dot.warn { background:var(--warn); } .dot.bad { background:var(--bad); } .dot.idle { background:var(--idle); }
  main { max-width:1000px; margin:0 auto; padding:20px 16px 60px; display:grid; gap:16px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:16px 18px; min-width:0; }
  h2 { margin:0 0 10px; font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .check { display:grid; grid-template-columns:16px 150px 1fr; gap:10px; align-items:baseline; padding:9px 0; border-bottom:1px solid var(--border); }
  .check:last-child { border-bottom:0; }
  .check .area { font-weight:600; }
  .check .text { overflow-wrap:anywhere; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:10px; }
  .stat { background:var(--bg); border-radius:8px; padding:10px 12px; }
  .stat b { display:block; font-size:22px; line-height:1.2; }
  .stat span { font-size:12px; color:var(--muted); }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  td, th { text-align:left; padding:7px 6px; border-bottom:1px solid var(--border); vertical-align:top; overflow-wrap:anywhere; }
  th { color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  .btn { border:1px solid var(--border); background:var(--panel); color:var(--text); border-radius:8px; padding:6px 12px; font:inherit; font-size:13px; cursor:pointer; text-transform:none; letter-spacing:0; }
  .btn:disabled { opacity:.5; cursor:wait; }
  .muted { color:var(--muted); font-size:13px; }
  .empty { color:var(--muted); }
  @media (max-width:640px) { .check { grid-template-columns:16px 1fr; } .check .text { grid-column:2; } }
</style>
</head>
<body>
<header>
  <a href="/">← Dashboard</a>
  <h1>Health</h1>
  <span id="overall"></span>
</header>
<main>
  <section class="card">
    <h2>Right now</h2>
    <div id="checks"></div>
  </section>
  <section class="card">
    <h2>Last hour</h2>
    <div class="grid" id="stats"></div>
    <div class="muted" id="lastFallback" style="margin-top:10px"></div>
  </section>
  <section class="card">
    <h2>Her models <button class="btn" id="check" title="Sends each model one tiny test message (about 8 free requests)">Check models now</button></h2>
    <table id="models"></table>
  </section>
  <section class="card">
    <h2>Errors in the last hour</h2>
    <div id="errors"></div>
  </section>
</main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const short = (m) => String(m || '').split('/').pop();
const WORD = { ok: 'All good', warn: 'Needs a look', bad: 'Something is broken', idle: 'Quiet' };
const ago = (t) => { const m = Math.round((Date.now() - t) / 60000); return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : `${Math.round(m / 60)} h ago`; };
let checked = null;

async function load() {
  const h = await (await fetch('/api/health')).json();
  $('#overall').innerHTML = `<span class="dot ${h.overall}"></span><span class="${h.overall}">${WORD[h.overall]}</span>`;
  $('#checks').innerHTML = h.checks.map((c) => `<div class="check"><span class="dot ${c.state}"></span><span class="area">${esc(c.area)}</span><span class="text">${esc(c.text)}</span></div>`).join('');
  const l = h.lastHour;
  const stat = (n, t) => `<div class="stat"><b>${n}</b><span>${t}</span></div>`;
  $('#stats').innerHTML = stat(l.replies, 'replies') + stat(l.avgMs ? (l.avgMs / 1000).toFixed(1) + ' s' : '–', 'average reply time') +
    stat(l.fallbacks, 'times a backup took over') + stat(l.errors, 'errors') + stat(h.requestsLastMinute, 'NVIDIA requests in the last minute (free limit ~40)') +
    Object.entries(l.byModel).map(([m, n]) => stat(n, `replies by ${esc(m)}`)).join('');
  $('#lastFallback').textContent = l.lastFallback ? `Last switch: ${l.lastFallback}` : '';
  const m = h.models;
  const rows = [['Talking', m.talking], ['Talking backup', m.backup.join(', ')], ['Planning', m.planning.join(', ')], ['Eyes', m.eyes], ['Eyes backup', m.eyesBackup], ['Core teachers', m.teachers.join(', ')], ['Memory search', m.memory]];
  $('#models').innerHTML = '<tr><th>Job</th><th>Model</th><th>Check</th></tr>' + rows.map(([job, models]) => {
    const res = (checked || []).filter((c) => String(models).split(', ').includes(c.model) && c.roles.some((r) => r === job || (job === 'Planning' && r === 'Planning') || (job === 'Core teachers' && r === 'Core teacher')));
    const cell = res.length ? res.map((c) => `<span class="${c.ok ? 'ok' : 'bad'}">${c.ok ? '✓' : '✗'} ${esc(short(c.model))} ${c.ok ? `${(c.ms / 1000).toFixed(1)} s` : esc(c.note)}</span>`).join('<br>') : '<span class="muted">not checked</span>';
    return `<tr><td>${job}</td><td>${esc(String(models).split(', ').map(short).join(', '))}</td><td>${cell}</td></tr>`;
  }).join('');
  $('#errors').innerHTML = h.errorGroups.length ? '<table><tr><th>Where</th><th>Times</th><th>Last</th></tr>' + h.errorGroups.map((e) => `<tr><td>${esc(e.where)}</td><td>${e.count}</td><td>${esc(e.last)} <span class="muted">(${ago(e.at)})</span></td></tr>`).join('') + '</table>' : '<p class="empty">No errors in the last hour.</p>';
}
$('#check').onclick = async () => {
  const b = $('#check'); b.disabled = true; b.textContent = 'Checking…';
  try { checked = (await (await fetch('/api/health/models', { method: 'POST' })).json()).models; await load(); } catch {}
  b.disabled = false; b.textContent = 'Check models now';
};
load();
setInterval(load, 30000);
</script>
</body>
</html>
