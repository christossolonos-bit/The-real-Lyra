<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lyra Birthdays</title>
<style>
  :root { --bg:#f6f6f8; --panel:#fff; --text:#18181b; --muted:#6b6b76; --border:#e3e3e8; --accent:#0e9fbf; --good:#1f9d55; --bad:#c43c3c; --bday:#d9468f; --other:#7c5cff; --soon:#fdf0f6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0b1116; --panel:#111b22; --text:#e6f4f8; --muted:#8aa3ad; --border:#21323c; --accent:#3fe0ff; --good:#3ddc84; --bad:#ff6b6b; --bday:#ff7ab8; --other:#a58bff; --soon:#2a1622; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,sans-serif; }
  header { display:flex; gap:14px; align-items:center; padding:14px 20px; border-bottom:1px solid var(--border); background:var(--panel); flex-wrap:wrap; }
  header a { color:var(--muted); text-decoration:none; }
  header h1 { margin:0; font-size:18px; }
  header .add { margin-left:auto; }
  button { font:inherit; cursor:pointer; }
  .btn { border:1px solid var(--border); background:var(--panel); color:var(--text); border-radius:8px; padding:5px 12px; font-size:14px; }
  .btn.primary { background:var(--accent); color:#001; border-color:var(--accent); }
  .btn.danger { color:var(--bad); }
  main { max-width:1100px; margin:0 auto; padding:20px 16px 60px; display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:16px; align-items:start; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:16px 18px; min-width:0; }
  h2 { margin:0 0 10px; font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  .monthbar { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
  .monthbar h3 { margin:0; font-size:18px; flex:1; text-align:center; }
  .grid { display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:4px; }
  .dow { font-size:12px; color:var(--muted); text-align:center; padding:2px 0; }
  .day { min-height:86px; border:1px solid var(--border); border-radius:8px; padding:4px 5px; display:flex; flex-direction:column; gap:3px; background:var(--panel); text-align:left; color:var(--text); min-width:0; }
  .day:hover { border-color:var(--accent); }
  .day.out { opacity:.35; }
  .day.today { border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); }
  .day.has { background:var(--soon); }
  .day .n { font-size:12px; color:var(--muted); }
  .day.today .n { color:var(--accent); font-weight:700; }
  .chip { font-size:12px; line-height:1.3; border-radius:5px; padding:1px 5px; background:var(--bday); color:#fff; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; border:0; text-align:left; width:100%; }
  .chip.other { background:var(--other); }
  .up { display:grid; gap:2px; }
  .row { display:grid; grid-template-columns:44px 1fr; gap:10px; align-items:center; padding:8px 6px; border-radius:8px; border:0; background:none; color:var(--text); text-align:left; width:100%; }
  .row:hover { background:var(--bg); }
  .row .when { text-align:center; line-height:1.1; }
  .row .when b { display:block; font-size:18px; }
  .row .when span { font-size:11px; color:var(--muted); text-transform:uppercase; }
  .row .who { font-weight:600; overflow-wrap:anywhere; }
  .row .sub { font-size:13px; color:var(--muted); }
  .row .sub.close { color:var(--bday); font-weight:600; }
  .empty { color:var(--muted); font-size:14px; }
  dialog { border:1px solid var(--border); border-radius:12px; background:var(--panel); color:var(--text); padding:18px; width:min(380px, calc(100% - 32px)); }
  dialog::backdrop { background:rgba(0,0,0,.4); }
  dialog h3 { margin:0 0 12px; }
  label { display:grid; gap:3px; font-size:13px; color:var(--muted); margin-bottom:10px; }
  input, select { font:inherit; font-size:15px; color:var(--text); background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:6px 9px; min-width:0; width:100%; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .three { display:grid; grid-template-columns:70px 1fr 90px; gap:8px; }
  .acts { display:flex; gap:8px; justify-content:flex-end; margin-top:6px; }
  .acts .danger { margin-right:auto; }
  .msg { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:8px 14px; border-radius:8px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; max-width:calc(100% - 32px); }
  .msg.show { opacity:1; }
  @media (max-width:820px) { main { grid-template-columns:1fr; } }
  @media (max-width:560px) {
    .card { padding:12px 10px; }
    .grid { gap:2px; }
    .day { min-height:54px; padding:3px; }
    .chip { font-size:0; padding:0; height:6px; border-radius:3px; }
  }
</style>
</head>
<body>
<header>
  <a href="/">← Dashboard</a>
  <h1>Birthdays</h1>
  <button class="btn primary add" id="add">+ Add a birthday</button>
</header>
<main>
  <section class="card">
    <div class="monthbar">
      <button class="btn" id="prev" aria-label="Previous month">‹</button>
      <h3 id="month"></h3>
      <button class="btn" id="next" aria-label="Next month">›</button>
      <button class="btn" id="today">Today</button>
    </div>
    <div class="grid" id="grid"></div>
  </section>
  <section class="card">
    <h2>Coming up</h2>
    <div class="up" id="up"></div>
  </section>
</main>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h3 id="dlgTitle">Add a birthday</h3>
    <div class="two">
      <label>Name<input id="fName" required maxlength="60" placeholder="e.g. Dad"></label>
      <label>Who they are<input id="fRel" maxlength="40" placeholder="e.g. dad, sister"></label>
    </div>
    <div class="three">
      <label>Day<input id="fDay" type="number" min="1" max="31" required></label>
      <label>Month<select id="fMonth"></select></label>
      <label>Born (year)<input id="fYear" type="number" min="1900" placeholder="optional"></label>
    </div>
    <label>What it is<select id="fKind"><option value="birthday">Birthday</option><option value="anniversary">Anniversary</option><option value="name day">Name day</option></select></label>
    <div class="acts">
      <button type="button" class="btn danger" id="del" hidden>Delete</button>
      <button type="button" class="btn" id="cancel">Cancel</button>
      <button type="submit" class="btn primary">Save</button>
    </div>
  </form>
</dialog>
<div class="msg" id="msg"></div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const MONTHS = Array.from({ length: 12 }, (_, i) => new Date(2024, i, 1).toLocaleDateString('en-GB', { month: 'long' }));
let people = [], view = new Date(), editing = null;
view.setDate(1);

function toast(t) { const m = $('#msg'); m.textContent = t; m.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => m.classList.remove('show'), 3000); }
async function api(method, url, body) {
  const r = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
const kind = (p) => p.kind || 'birthday';
const who = (p) => `${p.name}${p.relation && p.relation.toLowerCase() !== p.name.toLowerCase() ? ` (${p.relation})` : ''}`;
// the age they turn in a given year
const ageIn = (p, y) => (p.year && kind(p) === 'birthday' ? y - p.year : null);
// 29 Feb shows on 28 Feb in other years
const onDay = (p, y) => (p.month === 2 && p.day === 29 && new Date(y, 1, 29).getMonth() !== 1 ? 28 : p.day);

async function load() { people = (await api('GET', '/api/birthdays')).people; render(); }

function render() {
  const y = view.getFullYear(), m = view.getMonth();
  $('#month').textContent = `${MONTHS[m]} ${y}`;
  const now = new Date();
  const first = (new Date(y, m, 1).getDay() + 6) % 7; // weeks start on Monday
  const start = new Date(y, m, 1 - first);
  let html = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map((d) => `<div class="dow">${d}</div>`).join('');
  for (let i = 0; i < 42; i++) {
    const t = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
    if (i === 35 && t.getMonth() !== m) break; // no empty sixth week
    const here = people.filter((p) => p.month === t.getMonth() + 1 && onDay(p, t.getFullYear()) === t.getDate());
    const isToday = t.toDateString() === now.toDateString();
    html += `<div class="day${t.getMonth() !== m ? ' out' : ''}${isToday ? ' today' : ''}${here.length ? ' has' : ''}" data-d="${t.getDate()}" data-m="${t.getMonth() + 1}" role="button" tabindex="0" title="Add a birthday on ${t.getDate()} ${MONTHS[t.getMonth()]}">
      <span class="n">${t.getDate()}</span>
      ${here.map((p) => { const a = ageIn(p, t.getFullYear()); return `<button class="chip${kind(p) !== 'birthday' ? ' other' : ''}" data-id="${p.id}" title="${esc(`${who(p)}: ${kind(p)}${a ? `, turns ${a}` : ''}`)}">${kind(p) === 'birthday' ? '🎂' : '💜'} ${esc(p.name)}${a ? ` ${a}` : ''}</button>`; }).join('')}
    </div>`;
  }
  $('#grid').innerHTML = html;
  // coming up: everyone, soonest first
  $('#up').innerHTML = people.length ? people.map((p) => {
    const n = p.next, d = new Date(`${n.date}T12:00`);
    const close = n.days <= 7;
    const when = n.days === 0 ? 'Today! 🎉' : n.days === 1 ? 'Tomorrow' : `In ${n.days} days`;
    return `<button class="row" data-id="${p.id}">
      <div class="when"><b>${d.getDate()}</b><span>${MONTHS[d.getMonth()].slice(0, 3)}</span></div>
      <div><div class="who">${kind(p) === 'birthday' ? '🎂' : '💜'} ${esc(who(p))}</div>
      <div class="sub${close ? ' close' : ''}">${when}${n.age && kind(p) === 'birthday' ? ` · turns ${n.age}` : kind(p) !== 'birthday' ? ` · ${esc(kind(p))}` : ''}</div></div>
    </button>`;
  }).join('') : '<p class="empty">No birthdays yet. Add one here, or just tell Lyra ("my sister\'s birthday is 3 March").</p>';
}

function open(p, preset = {}) {
  editing = p || null;
  $('#dlgTitle').textContent = p ? `Edit ${p.name}` : 'Add a birthday';
  $('#fName').value = p?.name || '';
  $('#fRel').value = p?.relation || '';
  $('#fDay').value = p?.day || preset.day || '';
  $('#fMonth').value = String(p?.month || preset.month || view.getMonth() + 1);
  $('#fYear').value = p?.year || '';
  $('#fKind').value = kind(p || {});
  $('#del').hidden = !p;
  $('#dlg').showModal();
  $('#fName').focus();
}

$('#fMonth').innerHTML = MONTHS.map((n, i) => `<option value="${i + 1}">${n}</option>`).join('');
$('#fYear').max = new Date().getFullYear();
$('#prev').onclick = () => { view.setMonth(view.getMonth() - 1); render(); };
$('#next').onclick = () => { view.setMonth(view.getMonth() + 1); render(); };
$('#today').onclick = () => { view = new Date(); view.setDate(1); render(); };
$('#add').onclick = () => open(null);
$('#cancel').onclick = () => $('#dlg').close();
$('#grid').onclick = (e) => {
  const chip = e.target.closest('.chip');
  if (chip) return open(people.find((p) => p.id === Number(chip.dataset.id)));
  const day = e.target.closest('.day');
  if (day) open(null, { day: Number(day.dataset.d), month: Number(day.dataset.m) });
};
$('#grid').onkeydown = (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('day')) { e.preventDefault(); e.target.click(); } };
$('#up').onclick = (e) => {
  const row = e.target.closest('.row');
  if (!row) return;
  const p = people.find((x) => x.id === Number(row.dataset.id));
  view = new Date(`${p.next.date}T12:00`); view.setDate(1); render();
  open(p);
};
$('#form').onsubmit = async (e) => {
  e.preventDefault();
  const body = { name: $('#fName').value, relation: $('#fRel').value, day: $('#fDay').value, month: $('#fMonth').value, year: $('#fYear').value || undefined, kind: $('#fKind').value };
  try {
    const r = editing ? await api('PUT', `/api/birthdays/${editing.id}`, body) : await api('POST', '/api/birthdays', body);
    $('#dlg').close(); toast(r.message); load();
  } catch (err) { toast(err.message); }
};
$('#del').onclick = async () => {
  if (!editing || !confirm(`Delete ${editing.name}'s ${kind(editing)}?`)) return;
  try { const r = await api('DELETE', `/api/birthdays/${editing.id}`); $('#dlg').close(); toast(r.message); load(); } catch (err) { toast(err.message); }
};
load().catch((err) => toast(`Couldn't load birthdays: ${err.message}`));
setInterval(() => { if (!$('#dlg').open) load().catch(() => {}); }, 60_000);
</script>
</body>
</html>
