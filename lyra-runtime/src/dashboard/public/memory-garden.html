<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lyra Memory Garden</title>
<style>
  :root { --bg:#f6f6f8; --panel:#fff; --text:#18181b; --muted:#6b6b76; --border:#e3e3e8; --accent:#0e9fbf; --good:#1f9d55; --warn:#c27c0e; --bad:#c43c3c; --gone:#f6e1e1; --kept:#e2f4ea; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0b1116; --panel:#111b22; --text:#e6f4f8; --muted:#8aa3ad; --border:#21323c; --accent:#3fe0ff; --good:#3ddc84; --warn:#f0b445; --bad:#ff6b6b; --gone:#2d1618; --kept:#12281d; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,sans-serif; }
  header { display:flex; gap:12px; align-items:center; padding:14px 20px; border-bottom:1px solid var(--border); background:var(--panel); flex-wrap:wrap; }
  header a { color:var(--muted); text-decoration:none; }
  header h1 { margin:0; font-size:18px; }
  header .right { margin-left:auto; display:flex; gap:10px; align-items:center; font-size:13px; color:var(--muted); }
  main { max-width:860px; margin:0 auto; padding:20px 16px 60px; display:grid; gap:16px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:16px 18px; min-width:0; }
  h2 { margin:0 0 10px; font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  .btn { border:1px solid var(--border); background:var(--panel); color:var(--text); border-radius:8px; padding:6px 12px; font:inherit; font-size:13px; cursor:pointer; }
  .btn.go { background:var(--accent); color:#001; border-color:var(--accent); }
  .btn.no { color:var(--bad); border-color:var(--bad); }
  .btn:disabled { opacity:.5; cursor:wait; }
  .sug { border-bottom:1px solid var(--border); padding:14px 0; display:grid; gap:8px; }
  .sug:last-child { border-bottom:0; }
  .top { display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; }
  .kind { font-size:11px; border-radius:6px; padding:1px 7px; border:1px solid currentColor; font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  .kind.duplicate { color:var(--accent); } .kind.vague { color:var(--warn); } .kind.personal { color:var(--bad); }
  .why { color:var(--muted); font-size:13px; }
  .mem { border-radius:8px; padding:7px 10px; font-size:14px; overflow-wrap:anywhere; display:flex; gap:8px; }
  .mem.gone { background:var(--gone); } .mem.kept { background:var(--kept); }
  .mem .tag { font-size:11px; font-weight:700; flex:none; min-width:52px; color:var(--muted); text-transform:uppercase; padding-top:2px; }
  .acts { display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; }
  .empty { color:var(--muted); }
  .recent { font-size:13px; color:var(--muted); display:grid; gap:2px; }
  .msg { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:8px 14px; border-radius:8px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; max-width:calc(100% - 32px); }
  .msg.show { opacity:1; }
</style>
</head>
<body>
<header>
  <a href="/">← Dashboard</a>
  <h1>Memory garden</h1>
  <span class="right"><span id="info"></span><button class="btn" id="scan">Look now</button></span>
</header>
<main>
  <section class="card">
    <div class="why">The gardener looks over what Lyra remembers once a day and suggests tidying up: duplicates to merge, vague memories to drop, and personal ones for you to decide on. Nothing changes until you press a button.</div>
  </section>
  <section class="card">
    <h2 id="count">Suggestions</h2>
    <div id="list"></div>
  </section>
  <section class="card">
    <h2>Recently decided</h2>
    <div class="recent" id="recent"></div>
  </section>
</main>
<div class="msg" id="msg"></div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const day = (t) => (t ? new Date(t).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) : '');
function toast(t) { const m = $('#msg'); m.textContent = t; m.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => m.classList.remove('show'), 3000); }
async function api(method, url) { const r = await fetch(url, { method }); const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || r.statusText); return j; }
const ACTS = {
  duplicate: { go: 'Merge (remove the extras)', no: 'Leave them' },
  vague: { go: 'Remove it', no: 'Keep it' },
  personal: { go: 'Remove it', no: "Keep it, that's fine" },
};
async function load() {
  const g = await api('GET', '/api/garden');
  $('#info').textContent = `${g.total} memories · last looked ${g.scannedAt ? new Date(g.scannedAt).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : 'never'}`;
  $('#count').textContent = g.pending.length ? `Suggestions (${g.pending.length})` : 'Suggestions';
  $('#list').innerHTML = g.pending.length ? g.pending.map((s) => `<div class="sug" data-id="${s.id}">
      <div class="top"><span class="kind ${s.kind}">${s.kind}</span><b>${esc(s.person)}</b></div>
      <div class="why">${esc(s.why)}</div>
      ${s.items.map((i) => {
        const gone = s.kind === 'duplicate' ? !i.keep : s.kind !== 'personal';
        const tag = s.kind === 'duplicate' ? (i.keep ? 'keep' : 'remove') : s.kind === 'personal' ? '' : 'remove';
        return `<div class="mem ${s.kind === 'personal' ? '' : gone ? 'gone' : 'kept'}">${tag ? `<span class="tag">${tag}</span>` : ''}<span>${esc(i.text)} <span class="why">(${day(i.at)})</span></span></div>`;
      }).join('')}
      <div class="acts"><button class="btn" data-act="dismiss">${ACTS[s.kind].no}</button><button class="btn ${s.kind === 'duplicate' ? 'go' : 'no'}" data-act="accept">${ACTS[s.kind].go}</button></div>
    </div>`).join('') : '<p class="empty">Nothing to tidy right now.</p>';
  $('#recent').innerHTML = g.recent.length ? g.recent.map((r) => `<div>${day(r.at)} · ${esc(r.kind)} about ${esc(r.person)}: <b>${r.status === 'accepted' ? 'done' : 'left as is'}</b></div>`).join('') : '<span>Nothing yet.</span>';
}
$('#list').onclick = async (e) => {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const id = b.closest('.sug').dataset.id;
  b.closest('.acts').querySelectorAll('button').forEach((x) => (x.disabled = true));
  try { toast((await api('POST', `/api/garden/${id}/${b.dataset.act}`)).message); await load(); } catch (err) { toast(err.message); load(); }
};
$('#scan').onclick = async () => { const b = $('#scan'); b.disabled = true; try { toast((await api('POST', '/api/garden/scan')).message); await load(); } catch (err) { toast(err.message); } b.disabled = false; };
load().catch((err) => toast(`Couldn't load: ${err.message}`));
</script>
</body>
</html>
